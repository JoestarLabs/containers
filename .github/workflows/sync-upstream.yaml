name: Sync Plezy Upstream

on:
  schedule:
    - cron: '47 3 * * *' # Runs daily at 3:47 AM UTC (uneven time to avoid queue delays)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Upstream Files
        run: |
          cd plezy-relay
          curl -sL https://github.com/edde746/plezy/archive/refs/heads/main.tar.gz | tar -xz --strip-components=2 --exclude="*_test.go" --wildcards "plezy-main/server/*.go" "plezy-main/server/go.mod" "plezy-main/server/go.sum"
          
          # Maintain our custom target OS/ARCH flags in Dockerfile during sync
          # We download the upstream one to temporary location first
          curl -s https://raw.githubusercontent.com/edde746/plezy/main/server/Dockerfile > Dockerfile.temp
          
          # If target flags aren't in the downloaded file, insert them to preserve compilation correctness
          if ! grep -q "ARG TARGETOS" Dockerfile.temp; then
            sed -i '/FROM golang:.* AS build/a # Set by Docker Buildx automatically\nARG TARGETOS\nARG TARGETARCH' Dockerfile.temp
            sed -i 's/go build -ldflags/GOOS=$TARGETOS GOARCH=$TARGETARCH go build -ldflags/g' Dockerfile.temp
          fi
          mv Dockerfile.temp Dockerfile

      - name: Build PR Body
        id: pr_body
        run: |
          # Read the upstream SHA we last synced from (stored in tracking file committed alongside source)
          SINCE_SHA=""
          if [ -f plezy-relay/.upstream-sha ]; then
            SINCE_SHA=$(cat plezy-relay/.upstream-sha)
          fi

          # Fetch commits touching server/ and list only those newer than our last-synced SHA
          RAW=$(curl -s "https://api.github.com/repos/edde746/plezy/commits?path=server&per_page=20")
          if [ -n "$SINCE_SHA" ]; then
            COMMITS=$(echo "$RAW" | jq -r --arg s "$SINCE_SHA" \
              '(map(.sha) | index($s)) as $i | .[:($i // length)] | .[] | "- " + (.commit.message | split("\n")[0])' \
              2>/dev/null || true)
          fi

          # Fallback: just show the last 5 subjects touching server/
          if [ -z "$COMMITS" ]; then
            COMMITS=$(echo "$RAW" | jq -r '.[0:5][] | "- " + (.commit.message | split("\n")[0])')
          fi

          # Persist latest upstream SHA so the next sync knows where to diff from
          LATEST_SHA=$(echo "$RAW" | jq -r '.[0].sha')
          echo "$LATEST_SHA" > plezy-relay/.upstream-sha

          # Write body (multiline-safe via heredoc output)
          {
            echo "Automatically synchronized \`plezy-relay\` Go source files and Dockerfile with the upstream repository \`edde746/plezy\`."
            echo ""
            echo "**Upstream commits (server/) since last sync:**"
            echo "$COMMITS"
            echo ""
            echo "Merging this PR will trigger the multi-arch build and push workflow."
          } > /tmp/pr_body.md

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/pr_body.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): sync plezy-relay files with upstream"
          title: "chore(deps): sync plezy-relay with upstream"
          body: ${{ steps.pr_body.outputs.body }}
          branch: sync-plezy-upstream
          delete-branch: true
