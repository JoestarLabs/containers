name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      context_path:
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Prevent concurrent promote jobs from racing on the `latest` manifest.
# Builds themselves can run concurrently across callers.
concurrency:
  group: promote-${{ inputs.image_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true   # Don't burn runner minutes if one arch fails
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm # Native ARM64 GitHub Runner
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Downcase owner name
        run: |
          echo "OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Single-Arch Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context_path }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/${{ inputs.image_name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ matrix.arch }}

  promote:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Create and Push Multi-Arch Manifest
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER_LOWER}/${{ inputs.image_name }}"
          TAG_SHA="${BASE}:sha-${{ github.sha }}"
          TAG_LATEST="${BASE}:latest"

          SRCS="${BASE}:sha-${{ github.sha }}-amd64 ${BASE}:sha-${{ github.sha }}-arm64"

          # Create immutable SHA-tagged manifest and mutable latest manifest
          docker buildx imagetools create --tag "${TAG_SHA}"    ${SRCS}
          docker buildx imagetools create --tag "${TAG_LATEST}" ${SRCS}

